<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Analyzer</title>
    <!-- Link to Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?display=swap&family=Inter%3Awght%40400%3B500%3B700&family=Noto+Sans%3Awght%40400%3B500%3B700" />
    <!-- Cache-busting for the stylesheet -->
    <link rel="stylesheet" href="/static/style.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z" fill="currentColor"></path></svg>
                <h1>Watch Analyzer</h1>
            </div>
        </header>

        <main>
            <!-- Row 1: Parameters, Actions, and Results -->
            <div class="main-row">
                <div class="card" id="parameters-card">
                    <h3>Parameters</h3>
                    <div class="control-group">
                        <label for="bph">BPH:</label>
                        <select id="bph">
                            <option value="28800" selected>28800</option>
                            <option value="18000">18000</option>
                            <option value="21600">21600</option>
                            <option value="25200">25200</option>
                            <option value="36000">36000</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="liftAngle">Lift Angle:</label>
                        <select id="liftAngle">
                            <option value="52" selected>52°</option>
                            <option value="42">42°</option>
                            <option value="43">43°</option>
                            <option value="44">44°</option>
                            <option value="45">45°</option>
                            <option value="46">46°</option>
                            <option value="48">48°</option>
                            <option value="49">49°</option>
                            <option value="50">50°</option>
                            <option value="51">51°</option>
                            <option value="52" selected>52°</option>
                            <option value="53">53°</option>
                            <option value="54">54°</option>
                            <option value="54.5">54.5°</option>
                            <option value="55">55°</option>
                            <option value="56">56°</option>
                            <option value="57">57°</option>
                            <option value="58">58°</option>
                            <option value="60">60°</option>
                        </select>
                    </div>
                </div>

                <div class="card" id="actions-card">
                    <h3>Actions</h3>
                    <div class="button-group">
                        <button id="startMonitoring">Start Monitoring</button>
                        <button id="captureSample" disabled>Capture 6s Sample</button>
                    </div>
                    <div id="loadingSpinner" style="display: none;">Analyzing...</div>
                </div>

                <div class="card" id="results-card">
                    <h3>Results</h3>
                    <div id="results-display">
                        <div class="metric"><span>Rate (s/d)</span><p id="rateResult">-</p></div>
                        <div class="metric"><span>Beat Error (ms)</span><p id="beatErrorResult">-</p></div>
                        <div class="metric"><span>Amplitude (°)</span><p id="amplitudeResult">-</p></div>
                    </div>
                </div>
            </div>

            <!-- Row 2: Live Monitoring -->
            <div class="card" id="monitoring-card">
                <h3>Live Monitoring</h3>
                <div class="control-group">
                    <label for="gainSlider">Gain:</label>
                    <input type="range" id="gainSlider" min="0" max="5" step="0.1" value="1" disabled>
                </div>
                <div id="peak-meter"><div id="peak-meter-bar"></div></div>
                <canvas id="waveformCanvas"></canvas>
            </div>

            <!-- Row 3: Detailed Analysis Charts -->
            <div class="main-row">
                <div class="card chart-card">
                    <h3>Averaged Waveform</h3>
                    <canvas id="averagedWaveformCanvas"></canvas>
                </div>
                <div class="card chart-card">
                    <h3>Beat Timeline</h3>
                    <canvas id="beatErrorCanvas"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
